spring.application.name=circuit-breaker-facturador-electronico

spring.aplication.lyfecycle.timeout-per-shutdown-phase=20s

server.port=8095

proxy.services.auth=http://localhost:8101/api/v1/auth
proxy.services.usuarios=http://localhost:8101/api/v1/usuarios
proxy.services.clientes=http://localhost:8097/api/clientes
proxy.services.productos=http://localhost:8098/api/productos
proxy.services.facturas=http://localhost:8099/api/facturas
proxy.services.envios=http://localhost:8100/envios

resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-Type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.auth.baseConfig=default
resilience4j.circuitbreaker.instances.usuarios.baseConfig=default
resilience4j.circuitbreaker.instances.clientes.baseConfig=default
resilience4j.circuitbreaker.instances.productos.baseConfig=default
resilience4j.circuitbreaker.instances.facturas.baseConfig=default
resilience4j.circuitbreaker.instances.envios.baseConfig=default

management.endpoints.web.exposure.include= health,info,metrics,prometheus
management.endpoint.health.showdetails= when_authorized
management.health.circuitbreakers.enabled=true
management.metrics.tags.application=${spring.application.name}